# Verificação em todo push e pull request; publicação só na `main` e só depois do verde (RF-05.41 a RF-05.43).
# O `verificar` não usa segredo: o `.env` do runner é fictício (scripts/preparar-env-ci.mjs) e o Postgres é o do compose.
# A integração Git da Vercel está desligada (vercel.json): este workflow é o único caminho de publicação.
name: verificar-e-publicar

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22.20"
  VERCEL_CLI: vercel@66.4.0

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: verificar-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Preparar o .env do CI (valores fictícios)
        run: node scripts/preparar-env-ci.mjs
      - name: npm run verificar
        run: npm run verificar
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  publicar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: producao
    concurrency:
      group: producao
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Migração e semeadura pela URL direta do banco (não a do pooler); falha aqui impede a publicação.
      - name: Migrar o banco
        run: npm run db:migrar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRETA }}
      - name: Semear o dataset e as obras de exemplo
        run: npm run demo:semear
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRETA }}
      - name: Baixar a configuração do projeto na Vercel
        run: npx ${{ env.VERCEL_CLI }} pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx ${{ env.VERCEL_CLI }} build --prod --token="$VERCEL_TOKEN"
      - name: Publicar
        run: npx ${{ env.VERCEL_CLI }} deploy --prebuilt --prod --token="$VERCEL_TOKEN"
